<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>coshare | White Luxury</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Manrope', 'sans-serif'],
              serif: ['Playfair Display', 'serif'],
            },
            colors: {
              stone: {
                50: '#fafaf9',
                100: '#f5f5f4',
                200: '#e7e5e4',
                300: '#d6d3d1',
                400: '#a8a29e',
                500: '#78716c',
                600: '#57534e',
                700: '#44403c',
                800: '#292524',
                900: '#1c1917',
                950: '#0c0a09',
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Manrope', sans-serif;
        background-color: #fafaf9; /* Stone 50 */
        color: #1c1917; /* Stone 900 */
        -webkit-font-smoothing: antialiased;
      }
      /* Custom scrollbar for minimalist feel */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #d6d3d1; /* Stone 300 */
        border-radius: 999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #a8a29e; /* Stone 400 */
      }
      /* Page Transitions */
      .page-enter {
        opacity: 0;
        transform: translateY(20px) scale(0.98);
      }
      .page-enter-active {
        opacity: 1;
        transform: translateY(0) scale(1);
        transition: opacity 400ms ease-out, transform 400ms cubic-bezier(0.16, 1, 0.3, 1);
      }
      .page-exit {
        opacity: 1;
        transform: scale(1);
      }
      .page-exit-active {
        opacity: 0;
        transform: scale(0.98);
        transition: opacity 300ms, transform 300ms ease-in;
      }
      /* Blur-up Image Loading */
      .img-loading {
        filter: blur(20px);
        transform: scale(1.05);
      }
      .img-loaded {
        filter: blur(0);
        transform: scale(1);
        transition: filter 0.7s cubic-bezier(0.4, 0, 0.2, 1), transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
      }
      /* Hide hide scrollbar for horizontal scrolling areas */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  <script type="importmap">
{
  "imports": {

    "@google/genai": "https://esm.sh/@google/genai@^1.41.0"
  }
}
</script>
</head>

  </body>
</html>
